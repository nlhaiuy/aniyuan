<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <title>页面未找到 · 404</title>
    <script>
        (() => {
            try {
                if (localStorage.getItem('cmspro-appearance') === 'light') {
                    document.documentElement.classList.add('theme-light');
                }
            } catch (_) {}
        })();
    </script>
    <style>
        :root {
            color-scheme: dark;
            --page: #101114;
            --surface: #191a1f;
            --text: #f4f2ef;
            --text-muted: #a3a2a5;
            --line: rgba(255, 255, 255, .09);
            --accent: #d5fa6b;
            --accent-ink: #16190d;
        }

        :root.theme-light {
            color-scheme: light;
            --page: #fff;
            --surface: #f4f4f4;
            --text: #17181b;
            --text-muted: #66696d;
            --line: rgba(16, 17, 20, .1);
            --accent: #627f14;
            --accent-ink: #fff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--page);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        .error-page {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            place-items: center;
            padding: 32px 20px;
        }

        .error-card {
            width: min(100%, 560px);
            padding: 48px 40px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: var(--surface);
        }

        .error-code {
            margin: 0 0 24px;
            color: var(--accent);
            font-size: clamp(72px, 18vw, 112px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -.06em;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(24px, 5vw, 30px);
            font-weight: 700;
            line-height: 1.4;
        }

        .error-description {
            margin: 0;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        .home-link {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            padding: 0 22px;
            border: 1px solid transparent;
            border-radius: 7px;
            background: var(--accent);
            color: var(--accent-ink);
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            text-decoration: none;
        }

        .home-link:hover { text-decoration: underline; }

        .home-link:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 5px;
        }

        @media (max-width: 480px) {
            .error-card { padding: 36px 26px; }
            .home-link { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="error-page">
        <section class="error-card" aria-labelledby="error-title">
            <p class="error-code" aria-hidden="true">404</p>
            <h1 id="error-title">页面未找到</h1>
            <p class="error-description">链接可能已失效，或地址输入有误。<br>你可以返回首页，继续浏览喜欢的动漫。</p>
            <a class="home-link" href="/">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"></path>
                </svg>
                返回首页
            </a>
        </section>
    </main>


</body></html>
