name: sync-subscription

on:
  schedule:
    - cron: "17 1 * * *"      # 每天 UTC 01:17（北京时间 09:17）
  workflow_dispatch:           # 也可以在 Actions 页面手动运行
  push:
    branches: [main]
    paths:
      - "aniyuan/**"
      - "requirements.txt"
      - "config.json"
      - ".github/workflows/sync.yml"

# 默认只读。只有最后的 publish 任务单独申请写权限
permissions:
  contents: read

concurrency:
  group: sync-subscription
  cancel-in-progress: false

jobs:
  # 构建任务：会用无头浏览器去打开一堆第三方站点，所以只给只读权限，
  # 并且不把 GITHUB_TOKEN 留在 .git/config 里（persist-credentials: false）。
  # 产物只有几个 JSON 文件，通过 artifact 交给 publish 任务。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 安装无头浏览器（播放检测用）
        run: playwright install --with-deps chromium

      # config.json 的 browser 是 auto 时，按 state/browser.json 里选定的浏览器装对应内核（chrome 在 runner 上自带；默认 chromium 不用多装）
      - name: 安装自动选定的浏览器
        run: |
          name=$(python -m aniyuan.check.browser_pick resolve)
          echo "播放检测用的浏览器：$name"
          case "$name" in firefox|webkit) playwright install --with-deps "$name" ;; esac

      - name: 拉取最新的 KazumiRules、AniBakaRule 和纯纯看番社区源（完整历史，用来取每个规则的最后修改时间）
        run: |
          git clone https://github.com/Predidit/KazumiRules.git "$RUNNER_TEMP/KazumiRules"
          git clone https://github.com/AniBakaBaka/AniBakaRule.git "$RUNNER_TEMP/AniBakaRule"
          git clone https://github.com/easybangumiorg/CommunityJsExtensionEasyBangumi.git "$RUNNER_TEMP/EasyBangumi"
          git clone --depth 1 https://github.com/creamycake-anime/animeko-subs.git "$RUNNER_TEMP/animeko-subs"

      - name: 自测（翻译器 + 整条流水线）
        run: |
          KAZUMI_RULES="$RUNNER_TEMP/KazumiRules" python tests/test_xpath2css.py
          python tests/test_anx.py
          python tests/test_health.py
          python tests/test_normalize.py
          python tests/test_repair.py
          python tests/test_ua.py
          python tests/test_icons.py
          python tests/test_jsonapi.py
          python tests/test_playlearn.py
          python tests/test_changes.py
          python tests/test_live.py
          python tests/test_smoke_retry.py
          python tests/test_kazumi_selflink.py
          python tests/test_clash_node.py
          python tests/test_merge_redirect.py
          python tests/test_exit_compare.py
          python tests/test_exit_pipeline.py
          python tests/test_fallback_keyword.py
          python tests/test_autolearn.py
          python tests/test_capture.py
          python tests/test_capture_direct.py
          python tests/test_browsers.py
          python tests/test_browser_pick.py
          python tests/test_browser_fallback.py
          python tests/test_pipeline.py

      # 可选：Secret CLASH_NODE 里放一个或多个 Clash 格式的节点（"- name: xxx" 一段一个，或完整的 proxies: 配置；
      # mihomo 支持的类型都行：http / socks5 / ss / vmess / trojan 等，可带自定义请求头）。必须是国内出口的节点。
      # 用 mihomo 在 runner 上起本地代理，按顺序逐个试，第一个能连通国内站的就用；都不通或没配置就走海外出口。
      # 想直接给一个 http / socks5 地址的话，用 Secret ANIYUAN_PROXY（见下一步）。
      # 节点内容只经 Secret 传入；密码 / 令牌 / X-*-Auth 之类的值会用 add-mask 从日志里遮掉。
      - name: 启动 Clash 节点代理（可选）
        env:
          CLASH_NODE: ${{ secrets.CLASH_NODE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -z "$CLASH_NODE" ] && exit 0
          note() { echo "ANIYUAN_PROXY_NOTE=$1" >> "$GITHUB_ENV"; echo "$1"; }
          out=$(python -m aniyuan.check.clash_node "$RUNNER_TEMP/mihomo") || { note "CLASH_NODE 格式不对，没有启用"; exit 0; }
          printf '%s\n' "$out" | grep '^::add-mask::' || true   # 命令替换会吞掉输出，遮罩指令要重新打出来才生效
          count=$(printf '%s\n' "$out" | tail -n 1)
          url=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '[.assets[].browser_download_url | select(test("/mihomo-linux-amd64-v[0-9]+\\.[0-9]+\\.[0-9]+\\.gz$"))][0]')
          if [ -z "$url" ] || [ "$url" = "null" ]; then note "没找到 mihomo 的 linux-amd64 发行包"; exit 0; fi
          curl -sSL --fail -o "$RUNNER_TEMP/mihomo.gz" "$url" && gunzip -f "$RUNNER_TEMP/mihomo.gz" && chmod +x "$RUNNER_TEMP/mihomo" || { note "mihomo 下载失败"; exit 0; }
          mkdir -p "$RUNNER_TEMP/mh"
          fails=""
          for i in $(seq 1 "$count"); do
            cfg="$RUNNER_TEMP/mihomo.$i.yaml"
            if ! "$RUNNER_TEMP/mihomo" -t -f "$cfg" -d "$RUNNER_TEMP/mh" > "$RUNNER_TEMP/mihomo-test.log" 2>&1; then
              echo "第 $i 个节点：配置 mihomo 不认"; tail -n 6 "$RUNNER_TEMP/mihomo-test.log"
              fails="$fails 第$i个配置不对"; continue
            fi
            "$RUNNER_TEMP/mihomo" -f "$cfg" -d "$RUNNER_TEMP/mh" > "$RUNNER_TEMP/mihomo.log" 2>&1 &
            pid=$!
            sleep 3
            rc=0   # bash -e 下 curl 失败会直接退出整个脚本，所以用 || 接住退出码
            code=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' --socks5-hostname 127.0.0.1:7890 https://www.baidu.com 2>"$RUNNER_TEMP/curl.err") || rc=$?
            if [ "$rc" = 0 ] && [ "$code" != "000" ]; then
              echo "第 $i 个节点可用（经它访问百度返回 HTTP $code）"
              echo "ANIYUAN_PROXY=socks5h://127.0.0.1:7890" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "第 $i 个节点不通：curl 退出码 $rc，HTTP $code：$(cat "$RUNNER_TEMP/curl.err")"
            tail -n 6 "$RUNNER_TEMP/mihomo.log"
            kill $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true
            fails="$fails 第$i个连不通(curl $rc)"
          done
          note "已配置 CLASH_NODE（$count 个节点），但都不能用：${fails# }"

      - name: 转换并做联网冒烟测试
        env:
          # 优先用上一步 mihomo 起的本地代理；否则用 Secret ANIYUAN_PROXY（http/socks5 地址）；都没有就是空串，走 GitHub 海外出口
          ANIYUAN_PROXY: ${{ env.ANIYUAN_PROXY || secrets.ANIYUAN_PROXY }}
        # 有 xvfb 就在虚拟显示器里跑：选了 chrome 时它会用有头模式（更不像自动化）；其它浏览器不受影响
        run: |
          RUN="python"; command -v xvfb-run >/dev/null && RUN="xvfb-run -a python"
          $RUN -m aniyuan --kazumi "$RUNNER_TEMP/KazumiRules" --anibaka "$RUNNER_TEMP/AniBakaRule" --easybangumi "$RUNNER_TEMP/EasyBangumi" --official "$RUNNER_TEMP/animeko-subs" --out dist.new --icons-dir icons --smoke --playcheck

      # 只打包要发布的几个文件（白名单），不带别的东西
      - name: 打包产物
        run: |
          mkdir -p out/dist out/state out/icons
          cp dist.new/all.json dist.new/report.json dist.new/report.md out/dist/
          cp dist.new/summary.txt out/dist/ 2>/dev/null || true
          cp state/seen.json state/health.json out/state/
          cp state/play.json state/learned.json out/state/ 2>/dev/null || true
          cp icons/* out/icons/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: subscription
          path: out
          if-no-files-found: error
          retention-days: 3

  # 发布任务：有写权限，但不运行浏览器、不访问第三方站点，只检查并提交 JSON 文件。
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 构建要跑二十多分钟，期间主分支可能又有人推送；发布一律基于最新的主分支，而不是触发时的那个提交
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20   # 推送被拒时要变基，需要一点历史

      - uses: actions/download-artifact@v4
        with:
          name: subscription
          path: out

      - name: 安全检查（避免上游异常时把订阅清空）
        run: |
          python - <<'PY'
          import json, os, sys
          for p in ("out/dist/all.json", "out/dist/report.json", "out/state/seen.json", "out/state/health.json"):
              json.load(open(p, encoding="utf-8"))   # 必须是合法 JSON
          new = json.load(open("out/dist/all.json", encoding="utf-8"))["mediaSources"]
          old = json.load(open("dist/all.json", encoding="utf-8"))["mediaSources"] if os.path.exists("dist/all.json") else []
          print("旧 %d 条 -> 新 %d 条" % (len(old), len(new)))
          if not new or (old and len(new) < len(old) * 0.5):
              sys.exit("新订阅条目数异常偏少，已中止，不覆盖旧文件")
          PY

      # 图标是从第三方站点下载来的，发布前只放行小尺寸的真图片（按文件头判断），脚本、HTML、SVG 一律不收
      - name: 检查图标
        run: python -m aniyuan.icons --verify out/icons

      - name: 报告写入任务摘要
        run: cat out/dist/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 提交变更
        run: |
          cp out/dist/all.json out/dist/report.json out/dist/report.md dist/
          cp out/state/seen.json out/state/health.json state/
          cp out/state/play.json out/state/learned.json state/ 2>/dev/null || true
          mkdir -p icons && find icons -type f ! -name '.gitkeep' -delete && cp out/icons/* icons/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist state icons
          if git diff --cached --quiet; then
            echo "订阅没有变化"
          else
            MSG="chore: 同步 Kazumi + AniBaka 规则并重新生成订阅"
            [ -s out/dist/summary.txt ] && MSG="$MSG（$(head -n1 out/dist/summary.txt)）"
            git commit -m "$MSG"
            # 推送被拒（主分支有新提交）就变基后重试；只有 dist/state/icons 是机器人写的，正常不会冲突
            for i in 1 2 3 4; do
              git push && exit 0
              echo "推送被拒，变基后重试（第 $i 次）"
              git pull --rebase origin main || { git rebase --abort 2>/dev/null; echo "变基冲突，放弃"; exit 1; }
            done
            echo "连续 4 次推送失败"; exit 1
          fi
