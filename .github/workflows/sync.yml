name: sync-subscription

on:
  schedule:
    - cron: "17 1 * * *"      # 每天 UTC 01:17（北京时间 09:17）
  workflow_dispatch:           # 也可以在 Actions 页面手动运行
  push:
    paths:
      - "*.py"
      - "config.json"
      - "overrides/**"
      - "baseline/**"
      - "manual/**"
      - ".github/workflows/sync.yml"

# 默认只读。只有最后的 publish 任务单独申请写权限
permissions:
  contents: read

concurrency:
  group: sync-subscription
  cancel-in-progress: false

jobs:
  # 构建任务：会用无头浏览器去打开一堆第三方站点，所以只给只读权限，
  # 并且不把 GITHUB_TOKEN 留在 .git/config 里（persist-credentials: false）。
  # 产物只有几个 JSON 文件，通过 artifact 交给 publish 任务。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 安装无头浏览器（播放检测用）
        run: playwright install --with-deps chromium

      - name: 拉取最新的 KazumiRules、AniBakaRule 和纯纯看番社区源（完整历史，用来取每个规则的最后修改时间）
        run: |
          git clone https://github.com/Predidit/KazumiRules.git "$RUNNER_TEMP/KazumiRules"
          git clone https://github.com/AniBakaBaka/AniBakaRule.git "$RUNNER_TEMP/AniBakaRule"
          git clone https://github.com/easybangumiorg/CommunityJsExtensionEasyBangumi.git "$RUNNER_TEMP/EasyBangumi"

      - name: 自测（翻译器 + 整条流水线）
        run: |
          KAZUMI_RULES="$RUNNER_TEMP/KazumiRules" python tests/test_xpath2css.py
          python tests/test_anx.py
          python tests/test_health.py
          python tests/test_normalize.py
          python tests/test_live.py
          python tests/test_pipeline.py

      - name: 转换并做联网冒烟测试
        run: python build.py --kazumi "$RUNNER_TEMP/KazumiRules" --anibaka "$RUNNER_TEMP/AniBakaRule" --easybangumi "$RUNNER_TEMP/EasyBangumi" --out dist.new --smoke --playcheck

      # 只打包要发布的几个文件（白名单），不带别的东西
      - name: 打包产物
        run: |
          mkdir -p out/dist out/state
          cp dist.new/all.json dist.new/report.json dist.new/report.md out/dist/
          cp state/seen.json state/health.json out/state/

      - uses: actions/upload-artifact@v4
        with:
          name: subscription
          path: out
          if-no-files-found: error
          retention-days: 3

  # 发布任务：有写权限，但不运行浏览器、不访问第三方站点，只检查并提交 JSON 文件。
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: subscription
          path: out

      - name: 安全检查（避免上游异常时把订阅清空）
        run: |
          python - <<'PY'
          import json, os, sys
          for p in ("out/dist/all.json", "out/dist/report.json", "out/state/seen.json", "out/state/health.json"):
              json.load(open(p, encoding="utf-8"))   # 必须是合法 JSON
          new = json.load(open("out/dist/all.json", encoding="utf-8"))["mediaSources"]
          old = json.load(open("dist/all.json", encoding="utf-8"))["mediaSources"] if os.path.exists("dist/all.json") else []
          print("旧 %d 条 -> 新 %d 条" % (len(old), len(new)))
          if not new or (old and len(new) < len(old) * 0.5):
              sys.exit("新订阅条目数异常偏少，已中止，不覆盖旧文件")
          PY

      - name: 报告写入任务摘要
        run: cat out/dist/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 提交变更
        run: |
          cp out/dist/all.json out/dist/report.json out/dist/report.md dist/
          cp out/state/seen.json out/state/health.json state/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist state
          if git diff --cached --quiet; then
            echo "订阅没有变化"
          else
            git commit -m "chore: 同步 Kazumi + AniBaka 规则并重新生成订阅"
            git push
          fi
