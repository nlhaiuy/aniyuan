name: sync-subscription

on:
  schedule:
    - cron: "17 1 * * *"      # 每天 UTC 01:17（北京时间 09:17）
  workflow_dispatch:           # 也可以在 Actions 页面手动运行
  push:
    paths:
      - "aniyuan/**"
      - "requirements.txt"
      - "config.json"
      - "overrides/**"
      - "baseline/**"
      - ".github/workflows/sync.yml"

# 默认只读。只有最后的 publish 任务单独申请写权限
permissions:
  contents: read

concurrency:
  group: sync-subscription
  cancel-in-progress: false

jobs:
  # 构建任务：会用无头浏览器去打开一堆第三方站点，所以只给只读权限，
  # 并且不把 GITHUB_TOKEN 留在 .git/config 里（persist-credentials: false）。
  # 产物只有几个 JSON 文件，通过 artifact 交给 publish 任务。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 安装无头浏览器（播放检测用）
        run: playwright install --with-deps chromium

      - name: 拉取最新的 KazumiRules、AniBakaRule 和纯纯看番社区源（完整历史，用来取每个规则的最后修改时间）
        run: |
          git clone https://github.com/Predidit/KazumiRules.git "$RUNNER_TEMP/KazumiRules"
          git clone https://github.com/AniBakaBaka/AniBakaRule.git "$RUNNER_TEMP/AniBakaRule"
          git clone https://github.com/easybangumiorg/CommunityJsExtensionEasyBangumi.git "$RUNNER_TEMP/EasyBangumi"

      - name: 自测（翻译器 + 整条流水线）
        run: |
          KAZUMI_RULES="$RUNNER_TEMP/KazumiRules" python tests/test_xpath2css.py
          python tests/test_anx.py
          python tests/test_health.py
          python tests/test_normalize.py
          python tests/test_repair.py
          python tests/test_ua.py
          python tests/test_icons.py
          python tests/test_jsonapi.py
          python tests/test_live.py
          python tests/test_pipeline.py

      # 可选：Secret VMESS_LINK 里放一个或多个 vmess:// 链接（一行一个，必须是国内出口的节点）。
      # 用 xray 在 runner 上起本地 socks5，按顺序试，第一个能连通的就用；都不通或没配置就走海外出口。
      # 链接只经 Secret 传入，日志里不打印内容。
      - name: 启动 vmess 代理（可选）
        env:
          VMESS_LINK: ${{ secrets.VMESS_LINK }}
        run: |
          [ -z "$VMESS_LINK" ] && exit 0
          curl -sSL --fail -o "$RUNNER_TEMP/x.zip" https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q -o "$RUNNER_TEMP/x.zip" xray -d "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/mkcfg.py" <<'PY'
          import sys, json, base64
          s = sys.argv[1].strip().removeprefix("vmess://")
          s += "=" * (-len(s) % 4)
          v = json.loads(base64.b64decode(s))
          net = v.get("net") or "tcp"
          ss = {"network": net, "security": "tls" if v.get("tls") == "tls" else "none"}
          if ss["security"] == "tls":
              ss["tlsSettings"] = {"serverName": v.get("sni") or v.get("host") or v["add"]}
          if net == "ws":
              ss["wsSettings"] = {"path": v.get("path") or "/", "headers": {"Host": v.get("host") or ""}}
          cfg = {"inbounds": [{"listen": "127.0.0.1", "port": 10808, "protocol": "socks", "settings": {"udp": False}}],
                 "outbounds": [{"protocol": "vmess", "settings": {"vnext": [{"address": v["add"], "port": int(v["port"]),
                   "users": [{"id": v["id"], "alterId": int(v.get("aid") or 0), "security": "auto"}]}]}, "streamSettings": ss}]}
          json.dump(cfg, open(sys.argv[2], "w"))
          PY
          n=0
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [ -z "$line" ] && continue
            n=$((n+1))
            python "$RUNNER_TEMP/mkcfg.py" "$line" "$RUNNER_TEMP/xray.json" 2>/dev/null || { echo "第 $n 个链接解析失败"; continue; }
            "$RUNNER_TEMP/xray" run -c "$RUNNER_TEMP/xray.json" >/dev/null 2>&1 &
            pid=$!
            sleep 2
            if curl -s -o /dev/null -m 10 --socks5-hostname 127.0.0.1:10808 https://www.baidu.com; then
              echo "第 $n 个 vmess 节点可用"
              echo "ANIYUAN_PROXY=socks5h://127.0.0.1:10808" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "第 $n 个 vmess 节点不通，换下一个"
            kill $pid 2>/dev/null || true
            sleep 1
          done <<< "$VMESS_LINK"
          echo "没有可用的 vmess 节点，走海外出口"

      - name: 转换并做联网冒烟测试
        env:
          # 优先用上一步起的 vmess 本地代理；否则用 Secret ANIYUAN_PROXY（http/socks5 地址）；都没有就是空串，走 GitHub 海外出口
          ANIYUAN_PROXY: ${{ env.ANIYUAN_PROXY || secrets.ANIYUAN_PROXY }}
        run: python -m aniyuan --kazumi "$RUNNER_TEMP/KazumiRules" --anibaka "$RUNNER_TEMP/AniBakaRule" --easybangumi "$RUNNER_TEMP/EasyBangumi" --out dist.new --icons-dir icons --smoke --playcheck

      # 只打包要发布的几个文件（白名单），不带别的东西
      - name: 打包产物
        run: |
          mkdir -p out/dist out/state out/icons
          cp dist.new/all.json dist.new/report.json dist.new/report.md out/dist/
          cp state/seen.json state/health.json out/state/
          cp icons/* out/icons/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: subscription
          path: out
          if-no-files-found: error
          retention-days: 3

  # 发布任务：有写权限，但不运行浏览器、不访问第三方站点，只检查并提交 JSON 文件。
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: subscription
          path: out

      - name: 安全检查（避免上游异常时把订阅清空）
        run: |
          python - <<'PY'
          import json, os, sys
          for p in ("out/dist/all.json", "out/dist/report.json", "out/state/seen.json", "out/state/health.json"):
              json.load(open(p, encoding="utf-8"))   # 必须是合法 JSON
          new = json.load(open("out/dist/all.json", encoding="utf-8"))["mediaSources"]
          old = json.load(open("dist/all.json", encoding="utf-8"))["mediaSources"] if os.path.exists("dist/all.json") else []
          print("旧 %d 条 -> 新 %d 条" % (len(old), len(new)))
          if not new or (old and len(new) < len(old) * 0.5):
              sys.exit("新订阅条目数异常偏少，已中止，不覆盖旧文件")
          PY

      # 图标是从第三方站点下载来的，发布前只放行小尺寸的真图片（按文件头判断），脚本、HTML、SVG 一律不收
      - name: 检查图标
        run: python -m aniyuan.icons --verify out/icons

      - name: 报告写入任务摘要
        run: cat out/dist/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 提交变更
        run: |
          cp out/dist/all.json out/dist/report.json out/dist/report.md dist/
          cp out/state/seen.json out/state/health.json state/
          mkdir -p icons && find icons -type f ! -name '.gitkeep' -delete && cp out/icons/* icons/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist state icons
          if git diff --cached --quiet; then
            echo "订阅没有变化"
          else
            git commit -m "chore: 同步 Kazumi + AniBaka 规则并重新生成订阅"
            git push
          fi
