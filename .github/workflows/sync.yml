name: sync-subscription

on:
  schedule:
    - cron: "17 1 * * *"      # 每天 UTC 01:17（北京时间 09:17）
  workflow_dispatch:           # 也可以在 Actions 页面手动运行
  push:
    branches: [main]
    paths:
      - "aniyuan/**"
      - "requirements.txt"
      - "config.json"
      - ".github/workflows/sync.yml"
      - ".github/actions/**"

# 默认只读。只有最后的 publish 任务单独申请写权限
permissions:
  contents: read

concurrency:
  group: sync-subscription
  cancel-in-progress: false

jobs:
  # 构建任务：会用无头浏览器去打开一堆第三方站点，所以只给只读权限，
  # 并且不把 GITHUB_TOKEN 留在 .git/config 里（persist-credentials: false）。
  # 产物只有几个 JSON 文件，通过 artifact 交给 publish 任务。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 安装无头浏览器（播放检测用）
        run: playwright install --with-deps chromium

      # config.json 的 browser 是 auto 时，按 state/browser.json 里选定的浏览器装对应内核（chrome 在 runner 上自带；默认 chromium 不用多装）
      - name: 安装自动选定的浏览器
        run: |
          name=$(python -m aniyuan.check.browser_pick resolve)
          echo "播放检测用的浏览器：$name"
          case "$name" in firefox|webkit) playwright install --with-deps "$name" ;; esac

      # 每周日（或手动运行）构建会拿没通过检测的候选在 chromium / chrome / firefox 里各重测一遍，需要 firefox
      - name: 安装 firefox（每周浏览器对比用）
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = 7 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then playwright install --with-deps firefox || true; fi

      - name: 拉取最新的 KazumiRules、AniBakaRule 和纯纯看番社区源（完整历史，用来取每个规则的最后修改时间）
        run: |
          git clone https://github.com/Predidit/KazumiRules.git "$RUNNER_TEMP/KazumiRules"
          git clone https://github.com/AniBakaBaka/AniBakaRule.git "$RUNNER_TEMP/AniBakaRule"
          git clone https://github.com/easybangumiorg/CommunityJsExtensionEasyBangumi.git "$RUNNER_TEMP/EasyBangumi"
          git clone --depth 1 https://github.com/creamycake-anime/animeko-subs.git "$RUNNER_TEMP/animeko-subs"

      - name: 自测（翻译器 + 整条流水线）
        # run_all.py 自动发现 tests/test_*.py 并行跑；新增测试不用再改这里
        run: KAZUMI_RULES="$RUNNER_TEMP/KazumiRules" python tests/run_all.py -j 4

      # 可选的国内出口代理：Secret CLASH_NODE（Clash 节点）→ mihomo 本地代理 → 环境变量 ANIYUAN_PROXY。细节见 .github/actions/clash-proxy/action.yml
      - name: 启动 Clash 节点代理（可选）
        uses: ./.github/actions/clash-proxy
        with:
          clash-node: ${{ secrets.CLASH_NODE }}

      - name: 转换并做联网冒烟测试
        env:
          # 优先用上一步 mihomo 起的本地代理；否则用 Secret ANIYUAN_PROXY（http/socks5 地址）；都没有就是空串，走 GitHub 海外出口
          ANIYUAN_PROXY: ${{ env.ANIYUAN_PROXY || secrets.ANIYUAN_PROXY }}
        # 有 xvfb 就在虚拟显示器里跑：选了 chrome 时它会用有头模式（更不像自动化）；其它浏览器不受影响
        run: |
          RUN="python"; command -v xvfb-run >/dev/null && RUN="xvfb-run -a python"
          $RUN -m aniyuan --kazumi "$RUNNER_TEMP/KazumiRules" --anibaka "$RUNNER_TEMP/AniBakaRule" --easybangumi "$RUNNER_TEMP/EasyBangumi" --official "$RUNNER_TEMP/animeko-subs" --out dist.new --icons-dir icons --smoke --playcheck

      # 只打包要发布的几个文件（白名单），不带别的东西
      - name: 打包产物
        run: |
          mkdir -p out/dist out/state out/icons
          cp dist.new/all.json dist.new/report.json dist.new/report.md out/dist/
          cp dist.new/summary.txt out/dist/ 2>/dev/null || true
          cp state/seen.json state/health.json out/state/
          for f in play learned browser channels; do [ -f "state/$f.json" ] && cp "state/$f.json" out/state/; done
          cp icons/* out/icons/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: subscription
          path: out
          if-no-files-found: error
          retention-days: 3

  # 发布任务：有写权限，但不运行浏览器、不访问第三方站点，只检查并提交 JSON 文件。
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 构建要跑二十多分钟，期间主分支可能又有人推送；发布一律基于最新的主分支，而不是触发时的那个提交
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20   # 推送被拒时要变基，需要一点历史

      - uses: actions/download-artifact@v4
        with:
          name: subscription
          path: out

      - name: 安全检查（避免上游异常时把订阅清空）
        run: |
          python - <<'PY'
          import json, os, sys
          for p in ("out/dist/all.json", "out/dist/report.json", "out/state/seen.json", "out/state/health.json"):
              json.load(open(p, encoding="utf-8"))   # 必须是合法 JSON
          new = json.load(open("out/dist/all.json", encoding="utf-8"))["mediaSources"]
          old = json.load(open("dist/all.json", encoding="utf-8"))["mediaSources"] if os.path.exists("dist/all.json") else []
          print("旧 %d 条 -> 新 %d 条" % (len(old), len(new)))
          if not new or (old and len(new) < len(old) * 0.5):
              sys.exit("新订阅条目数异常偏少，已中止，不覆盖旧文件")
          PY

      # 图标是从第三方站点下载来的，发布前只放行小尺寸的真图片（按文件头判断），脚本、HTML、SVG 一律不收
      - name: 检查图标
        run: python -m aniyuan.icons --verify out/icons

      - name: 报告写入任务摘要
        run: cat out/dist/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 提交变更
        run: |
          cp out/dist/all.json out/dist/report.json out/dist/report.md dist/
          cp out/state/seen.json out/state/health.json state/
          for f in play learned browser channels; do [ -f "out/state/$f.json" ] && cp "out/state/$f.json" state/; done; true
          mkdir -p icons && find icons -type f ! -name '.gitkeep' -delete && cp out/icons/* icons/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist state icons
          if git diff --cached --quiet; then
            echo "订阅没有变化"
          else
            MSG="chore: 同步 Kazumi + AniBaka 规则并重新生成订阅"
            [ -s out/dist/summary.txt ] && MSG="$MSG（$(head -n1 out/dist/summary.txt)）"
            git commit -m "$MSG"
            # 推送被拒（主分支有新提交）就变基后重试；只有 dist/state/icons 是机器人写的，正常不会冲突
            for i in 1 2 3 4; do
              git push && exit 0
              echo "推送被拒，变基后重试（第 $i 次）"
              git pull --rebase origin main || { git rebase --abort 2>/dev/null; echo "变基冲突，放弃"; exit 1; }
            done
            echo "连续 4 次推送失败"; exit 1
          fi

  # 失败告警 / 自动恢复：定时或手动运行失败时自动开一个 issue（已有未关闭的就追加评论，不重复开）；
  # 之后某次运行成功了就自动关掉并留言。不需要任何额外配置，GitHub 会把 issue 通知发给你。
  status:
    needs: [build, publish]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "订阅同步失败（自动创建，恢复后自动关闭）"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILD: ${{ needs.build.result }}
      PUBLISH: ${{ needs.publish.result }}
    steps:
      - name: 开 / 更新 / 关闭 issue
        run: |
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '[.[] | select(.title == env.TITLE) | .number][0] // empty')
          if [ "$BUILD" = failure ] || [ "$PUBLISH" = failure ]; then
            body="同步失败：构建 \`$BUILD\`，发布 \`$PUBLISH\`。日志：$RUN_URL"
            if [ -n "$num" ]; then
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
            fi
          elif [ "$BUILD" = success ] && [ "$PUBLISH" = success ] && [ -n "$num" ]; then
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "已恢复：$RUN_URL"
          fi
